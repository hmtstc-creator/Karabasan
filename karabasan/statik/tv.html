<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Karabasan TV</title>
<link rel="stylesheet" href="/s/tv.css">
</head>
<body>
<!-- TV panosu: yalnız izlenir, dokunulmaz. Uzaktan kumanda gerekmez; ekranlar kendiliğinden döner, veri kendiliğinden yenilenir. -->
<header class="tv-ust">
  <span class="tv-marka">Karabasan</span>
  <span class="tv-sinav" id="sinav">…</span>
  <span class="tv-saat r" id="saat">--:--</span>
</header>
<main class="tv-ana" id="ana"><div class="tv-bos">Veri bekleniyor…</div></main>
<footer class="tv-alt">
  <div class="tv-noktalar" id="noktalar" aria-hidden="true"></div>
  <span class="tv-not" id="not">Sanal işlem. Gerçek para yok.</span>
</footer>
<script src="/s/tv.js"></script>
</body>
</html>
